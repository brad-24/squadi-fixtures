name: Sync Appointments

# Squadi blocks all cloud provider IPs (AWS, Cloudflare, GitHub-hosted runners).
# The scheduled job requires a self-hosted runner on a residential machine.
# Setup: GitHub repo → Settings → Actions → Runners → New self-hosted runner
# Manual dispatch runs on GitHub-hosted runners (will fail with 403, useful for testing).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        default: 'self-hosted'

jobs:
  sync:
    runs-on: ${{ github.event_name == 'schedule' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch appointments from Squadi
        run: node scripts/sync-appointments.mjs
        env:
          GIT_PUSH: 'false'

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/appointments.json
          if git diff --staged --quiet; then
            echo "No changes to appointments"
          else
            git commit -m "chore: sync appointments data"
            git push
          fi
